name: aperture-router
region: blr
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      error_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: ROUTER_STRATEGY
        value: adaptive
      - key: ROUTER_FALLBACK
        value: "true"
      - key: ROUTER_BACKEND
        value: mock_adaptive
