version: '3.8'

services:
  aperture:
    build:
      context: .
      dockerfile: Dockerfile
    image: aperture-router:latest
    container_name: aperture-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - ROUTER_STRATEGY=adaptive
      - ROUTER_FALLBACK=true
      - ROUTER_BACKEND=mock_adaptive
      - OLLAMA_URL=http://ollama:11434
    networks:
      - ai-mesh

networks:
  ai-mesh:
    driver: bridge
